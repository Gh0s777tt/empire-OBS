name: 🐛 Bug report
description: Report a problem with Empire-OBS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve **Empire‑OBS** 🎬"
  - type: input
    id: version
    attributes:
      label: Empire-OBS version
      placeholder: "v0.3.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened (steps to reproduce).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: OBS log
      description: From Help → Log Files, or `config/obs-studio/logs/*.txt`.
      render: shell
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "Windows 11, RTX 2050, 16 GB RAM"
    validations:
      required: true
