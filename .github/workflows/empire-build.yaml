name: 🎬 Empire Build

# Builds Empire-OBS on Windows, packages it (CPack, the OBS way), uploads the
# artifact, and — on version tags (v*) — publishes a GitHub Release.
# Uses the stock `windows-x64` preset (Visual Studio 2022 on the runner); the
# fork's VS-2026 build fixes are harmless there.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create releases

concurrency:
  group: empire-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build · Windows x64
    runs-on: windows-2022
    steps:
      - name: 📥 Checkout (submodules + full history)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🏷️ Fetch OBS version tags
        shell: pwsh
        # versionconfig.cmake derives the version from `git describe --tags`.
        run: |
          git remote add upstream https://github.com/obsproject/obs-studio.git
          git fetch --tags --quiet upstream
          Write-Host "Derived version: $(git describe --always --tags)"

      - name: 🛠️ Toolchain
        shell: pwsh
        run: cmake --version

      - name: 💾 Cache dependencies (Qt6 + CEF + obs-deps)
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-windows-x64-${{ hashFiles('CMakePresets.json') }}
          restore-keys: |
            deps-windows-x64-

      - name: ⚙️ Configure (downloads Qt6 + CEF + obs-deps)
        shell: pwsh
        run: |
          # OBS project() needs a numeric X.Y.Z. A "v"-prefixed tag (v0.5.1) or a bare
          # hash makes the git-describe-derived version invalid, so override explicitly.
          $desc = (git describe --always --tags)
          if ($desc -match '(\d+\.\d+\.\d+)') { $ver = $Matches[1] } else { $ver = '0.5.1' }
          Write-Host "OBS_VERSION_OVERRIDE=$ver (from '$desc')"
          cmake --preset windows-x64 "-DOBS_VERSION_OVERRIDE=$ver"

      - name: 🔨 Build (RelWithDebInfo)
        shell: pwsh
        run: cmake --build --preset windows-x64

      - name: 📦 Package (CPack ZIP, with fallback)
        id: pkg
        shell: pwsh
        run: |
          Push-Location build_x64
          try { cpack -C RelWithDebInfo } catch { Write-Warning "cpack failed: $_" }
          $zip = Get-ChildItem -Filter "*-windows-x64.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "CPack zip not found — falling back to rundir archive."
            Compress-Archive -Path "rundir/RelWithDebInfo/*" -DestinationPath "obs-studio-portable-windows-x64.zip" -Force
            $zip = Get-Item "obs-studio-portable-windows-x64.zip"
          }
          $ver = (git describe --always --tags)
          $out = "empire-obs-$ver-windows-x64.zip"
          Move-Item $zip.FullName "../$out" -Force
          Pop-Location
          "package=$out" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged: $out"

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-obs-windows-x64
          path: ${{ steps.pkg.outputs.package }}
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.package }}
          generate_release_notes: true
          body: |
            ## 🎬 Empire-OBS ${{ github.ref_name }}

            A cinematic, Netflix-styled fork of OBS Studio.
            See the [CHANGELOG](https://github.com/Gh0s777tt/empire-OBS/blob/empire/main/CHANGELOG.md) and [Wiki](https://github.com/Gh0s777tt/empire-OBS/wiki).
